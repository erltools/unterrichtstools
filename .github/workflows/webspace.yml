# Lädt die Website bei jedem Push auf main per SFTP auf den Webspace hoch.
# Einmalig in GitHub unter Settings > Secrets and variables > Actions anlegen:
#   SFTP_HOST, SFTP_USER, SFTP_PASSWORD und SFTP_DIR (Zielordner, bei netcup: /)
# Solange die Secrets fehlen, wird nichts hochgeladen.
name: Auf Webspace hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Zugangsdaten hinterlegt sind
        id: check
        env:
          HOST: ${{ secrets.SFTP_HOST }}
        run: echo "ready=$([ -n "$HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Hochladen
        if: steps.check.outputs.ready == 'yes'
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          LOGIN: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          DIR: ${{ secrets.SFTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Zeigt nur, welche Anmeldearten der Server anbietet (ohne Zugangsdaten zu senden).
          ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=none -o ConnectTimeout=20 "$LOGIN@$HOST" true 2>&1 | grep -i "Authentications that can continue" || true
          # Rundendaten der Wortwolke (daten/*.json) werden nie überschrieben oder gelöscht.
          EXCL="--exclude-glob .git* --exclude-glob .github/ --exclude-glob '*.json'"
          if lftp --env-password -u "$LOGIN" "sftp://$HOST" -e "set sftp:auto-confirm yes; mirror -R --verbose $EXCL ./ '${DIR:-.}'; bye"; then
            echo "Hochgeladen per SFTP"
          else
            echo "SFTP ging nicht, versuche verschlüsseltes FTP (FTPES)"
            lftp --env-password -u "$LOGIN" "ftp://$HOST" -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; mirror -R --verbose $EXCL ./ '${DIR:-.}'; bye"
          fi
