# Lädt die Website bei jedem Push auf main per SFTP auf den Webspace hoch.
# Einmalig in GitHub unter Settings > Secrets and variables > Actions anlegen:
#   SFTP_HOST, SFTP_USER, SFTP_PASSWORD und SFTP_DIR (Zielordner, z. B. /html/unterrichtstools)
# Solange die Secrets fehlen, wird nichts hochgeladen.
name: Auf Webspace hochladen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen, ob Zugangsdaten hinterlegt sind
        id: check
        env:
          HOST: ${{ secrets.SFTP_HOST }}
        run: echo "ready=$([ -n "$HOST" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Hochladen
        if: steps.check.outputs.ready == 'yes'
        env:
          HOST: ${{ secrets.SFTP_HOST }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          DIR: ${{ secrets.SFTP_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Rundendaten der Wortwolke (daten/*.json) werden nie überschrieben oder gelöscht.
          lftp -u "$USER","$PASS" "sftp://$HOST" -e "set sftp:auto-confirm yes; mirror -R --verbose --exclude-glob .git* --exclude-glob .github/ --exclude-glob '*.json' ./ '${DIR:-.}'; bye"
