<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterrichtstools</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
:root { --bg:#0f1216; --panel:#1a1f26; --line:#2c333d; --fg:#f3f5f7; --muted:#9aa4b1; color-scheme:dark; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  padding-left:max(20px,env(safe-area-inset-left,0px)); padding-right:max(20px,env(safe-area-inset-right,0px)); padding-block:32px; }
main { max-width:900px; margin:0 auto; display:grid; gap:24px; }
h1 { margin:0; font-size:clamp(32px,6vw,56px); }
p { margin:0; color:var(--muted); font-size:18px; line-height:1.5; }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
a.tool { display:grid; gap:8px; padding:24px; background:var(--panel); border:2px solid var(--line); border-radius:16px;
  color:var(--fg); text-decoration:none; min-height:120px; }
a.tool:focus-visible, a.tool:hover { border-color:var(--fg); }
a.tool strong { font-size:24px; }
.dots { display:flex; gap:6px; } .dots i { width:18px; height:18px; border-radius:50%; display:block; }
</style>
</head>
<body>
<main>
  <h1>Unterrichtstools</h1>
  <p>Kleine Helfer für den Unterricht. Am besten auf dem iPad in Safari öffnen.</p>
  <div class="grid">
    <a class="tool" href="ampel/">
      <span class="dots"><i style="background:#ef4444"></i><i style="background:#facc15"></i><i style="background:#22c55e"></i></span>
      <strong>Lautstärke-Ampel</strong>
      <p>Zeigt per Mikrofon, ob es in der Klasse zu laut ist.</p>
    </a>
    <a class="tool" href="wortwolke/">
      <span class="dots"><i style="background:#60a5fa"></i><i style="background:#fbbf24;width:12px;height:12px;align-self:end"></i><i style="background:#f472b6;width:14px;height:14px"></i></span>
      <strong>Wortwolke</strong>
      <p>Klasse schickt per QR-Code Wörter, die Wolke wächst live.</p>
    </a>
  </div>
</main>
</body>
</html>
